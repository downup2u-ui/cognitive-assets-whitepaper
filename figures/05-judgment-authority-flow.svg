    <rect x="1020" y="285" width="130" height="80" rx="10" fill="#EAF2FA" stroke="#AAB7C4"/><text x="1085" y="320" font-size="20" font-weight="700" fill="#222222">Action</text><text x="1085" y="348" font-size="20" font-weight="700" fill="#222222">/ Exit</text>
