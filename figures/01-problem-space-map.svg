  <line x1="190" y1="330" x2="1010" y2="330" stroke="#888888" stroke-width="3"/>
  <polygon points="1010,330 985,316 985,344" fill="#888888"/>
  <circle cx="240" cy="330" r="20" fill="#2F5D8C"/>
